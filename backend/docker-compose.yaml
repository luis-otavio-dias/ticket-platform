services:
  db:
    image: postgres:18.6-alpine
    container_name: ticket-site-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-luis_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-3yrXZbZfDN}
      - POSTGRES_DB=${POSTGRES_DB:-ticket_site_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-luis_admin} -d ${POSTGRES_DB:-ticket_site_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ticket-site-backend:
    image: ticket-site-backend
    container_name: ticket-site-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - POSTGRES_URL=postgres://${POSTGRES_USER:-luis_admin}:${POSTGRES_PASSWORD:-3yrXZbZfDN}@db:5432/${POSTGRES_DB:-ticket_site_db}
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .venv/
            - __pycache__/

        - action: rebuild
          path: ./uv.lock

volumes:
  postgres_data:
